<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Lite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Swiper CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .gradient-overlay {
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.4) 100%);
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-vinyl {
      animation: spinVinyl 4s linear infinite;
    }

    .feed-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden relative bg-black">

  <!-- TOP NAVIGATION HEADER TIKTOK -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 pt-3 pb-2 gradient-overlay pointer-events-none">
    <button class="pointer-events-auto text-white/80 active:opacity-60">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </button>
    
    <div class="flex items-center gap-4 text-sm font-semibold pointer-events-auto">
      <span class="text-white/60 cursor-pointer">Mengikuti</span>
      <span class="text-white border-b-2 border-white pb-0.5 font-bold cursor-pointer">Untuk Anda</span>
    </div>

    <button class="pointer-events-auto text-white/80 active:opacity-60">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>
  </header>

  <!-- MAIN VERTICAL SWIPER FEED -->
  <div class="swiper mySwiper w-full h-full">
    <div class="swiper-wrapper" id="videoContainer">
      <!-- Item video di-render otomatis dari app.js -->
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR TIKTOK -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-black/90 border-t border-zinc-800/80 px-4 py-2 flex justify-between items-center text-[10px]">
    <button class="flex flex-col items-center gap-1 text-white">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="font-semibold">Beranda</span>
    </button>

    <button class="flex flex-col items-center gap-1 text-zinc-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span>Teman</span>
    </button>

    <!-- Tombol Plus Khas TikTok -->
    <button class="relative w-11 h-7 flex items-center justify-center active:scale-95 transition-transform">
      <div class="absolute inset-0 bg-cyan-400 rounded-lg -translate-x-[2px]"></div>
      <div class="absolute inset-0 bg-pink-500 rounded-lg translate-x-[2px]"></div>
      <div class="relative w-full h-full bg-white rounded-lg flex items-center justify-center text-black font-extrabold text-lg">+</div>
    </button>

    <button class="flex flex-col items-center gap-1 text-zinc-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span>Kotak Masuk</span>
    </button>

    <button class="flex flex-col items-center gap-1 text-zinc-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- MODAL KOMENTAR (BOTTOM SHEET TIKTOK) -->
  <div id="commentModal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col justify-end transition-opacity duration-300">
    <div class="bg-zinc-900 rounded-t-2xl p-4 h-[65vh] flex flex-col shadow-2xl border-t border-zinc-800">
      
      <!-- Header Modal -->
      <div class="flex justify-between items-center mb-3 border-b border-zinc-800/80 pb-2">
        <div class="w-6"></div>
        <h4 id="commentCountHeader" class="font-bold text-xs text-center text-zinc-200">0 Komentar</h4>
        <button onclick="toggleComments(false)" class="text-zinc-400 font-bold text-xl hover:text-white px-1">&times;</button>
      </div>
      
      <!-- List Komentar -->
      <div id="commentList" class="flex-1 overflow-y-auto space-y-4 my-2 pr-1">
        <!-- List komentar di-render via JavaScript -->
      </div>

      <!-- Form Input Komentar -->
      <form onsubmit="addComment(event)" class="flex items-center gap-2 border-t border-zinc-800 pt-3 mt-auto">
        <input type="text" id="commentInput" placeholder="Tambah komentar..." class="flex-1 bg-zinc-800 rounded-full px-4 py-2 text-xs text-white focus:outline-none border border-zinc-700/60 placeholder-zinc-500">
        <button type="submit" class="bg-pink-600 text-white text-xs font-bold px-4 py-2 rounded-full active:scale-95 transition-transform">Kirim</button>
      </form>

    </div>
  </div>

  <!-- CDN JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</body>
</html>
