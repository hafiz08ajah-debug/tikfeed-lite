<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tikfeed Lite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Swiper CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white select-none overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="fixed top-0 left-0 right-0 z-30 flex justify-center items-center py-3 px-4 bg-gradient-to-b from-black/80 to-transparent">
    <div class="flex items-center gap-6 text-sm font-semibold tracking-wide">
      <button class="text-gray-400 hover:text-white transition-colors">Mengikuti</button>
      <div class="relative pb-1">
        <button class="text-white font-bold">Untuk Anda</button>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-white rounded-full"></div>
      </div>
    </div>
  </header>

  <!-- Swiper Vertical Container -->
  <main class="swiper mySwiper">
    <div class="swiper-wrapper" id="videoContainer">
      <!-- Video items will be injected dynamically by app.js -->
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 flex justify-around items-center py-2 px-3 bg-black/90 border-t border-white/10 text-xs">
    <button class="flex flex-col items-center gap-1 text-white">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Beranda</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span>Temukan</span>
    </button>
    <button class="flex items-center justify-center w-11 h-7 bg-gradient-to-r from-cyan-400 via-white to-pink-500 rounded-lg text-black font-bold text-lg active:scale-95 transition-transform">
      <span class="bg-white px-2 py-0.5 rounded text-black font-bold">+</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span>Kotak Masuk</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- Comment Modal Drawer -->
  <div id="commentModal" class="fixed inset-0 z-40 bg-black/60 hidden transition-opacity flex flex-col justify-end">
    <div class="bg-zinc-900 rounded-t-2xl p-4 h-[60vh] flex flex-col justify-between border-t border-white/10 animate-slide-up">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <span class="font-bold text-sm text-center flex-1" id="commentCountHeader">0 Komentar</span>
        <button onclick="toggleComments(false)" class="text-gray-400 text-xl font-bold px-2">&times;</button>
      </div>
      
      <!-- List Komentar -->
      <div class="flex-1 overflow-y-auto py-3 space-y-3" id="commentList">
        <!-- Injected dynamically -->
      </div>

      <!-- Input Komentar -->
      <form onsubmit="addComment(event)" class="flex gap-2 pt-2 border-t border-white/10">
        <input type="text" id="commentInput" placeholder="Tambah komentar..." class="flex-1 bg-zinc-800 text-sm text-white rounded-full px-4 py-2 focus:outline-none focus:ring-1 focus:ring-pink-500">
        <button type="submit" class="bg-pink-600 text-white font-bold text-xs px-4 py-2 rounded-full">Kirim</button>
      </form>
    </div>
  </div>

  <!-- Swiper JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <!-- Custom JS -->
  <script src="app.js"></script>
</body>
</html>
