<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tikfeed Lite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Swiper CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <style>
    .glass-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .gradient-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 5s linear infinite;
    }
    .feed-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-black text-white h-screen overflow-hidden select-none">

  <!-- Main Swiper Feed -->
  <div class="swiper mySwiper w-full h-full">
    <div class="swiper-wrapper" id="videoContainer">
      <!-- Video akan di-load otomatis dari Supabase via app.js -->
    </div>
  </div>

  <!-- Modal Komentar -->
  <div id="commentModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end">
    <div class="bg-zinc-900 rounded-t-2xl p-4 max-h-[60vh] flex flex-col">
      
      <!-- Header Modal -->
      <div class="flex justify-between items-center mb-3 border-b border-zinc-800 pb-2">
        <h4 id="commentCountHeader" class="font-bold text-xs text-gray-300">0 Komentar</h4>
        <button onclick="toggleComments(false)" class="text-gray-400 font-bold text-lg px-2">&times;</button>
      </div>
      
      <!-- List Komentar -->
      <div id="commentList" class="flex-1 overflow-y-auto space-y-3 mb-3 pr-1">
        <!-- Komentar di-render dinamis -->
      </div>

      <!-- Input Komentar -->
      <form onsubmit="addComment(event)" class="flex gap-2 border-t border-zinc-800 pt-3">
        <input type="text" id="commentInput" placeholder="Tambah komentar..." class="flex-1 bg-zinc-800 rounded-full px-4 py-2 text-xs text-white focus:outline-none border border-zinc-700 placeholder-gray-500">
        <button type="submit" class="bg-pink-600 text-white text-xs font-bold px-4 py-2 rounded-full active:scale-95 transition-transform">Kirim</button>
      </form>

    </div>
  </div>

  <!-- Swiper JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <!-- Supabase JS CDN (PENTING) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom App JS -->
  <script src="app.js"></script>

</body>
</html>
