<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikFeed - TikTok Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Menyembunyikan scrollbar untuk tampilan mirip aplikasi native */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black flex justify-center items-center min-h-screen text-white font-sans antialiased">

  <div class="relative w-full max-w-sm h-[100dvh] bg-black overflow-hidden flex flex-col border-x border-zinc-900">
    
    <header class="absolute top-0 left-0 right-0 z-30 flex justify-center items-center gap-6 py-4 bg-gradient-to-b from-black/70 to-transparent text-sm font-semibold pointer-events-none">
      <span class="opacity-60 cursor-pointer pointer-events-auto">Mengikuti</span>
      <span class="border-b-2 border-white pb-0.5 cursor-pointer pointer-events-auto">Untuk Anda</span>
    </header>

    <main id="videoContainer" class="w-full h-full overflow-y-scroll snap-y snap-mandatory no-scrollbar flex-1">
      </main>

    <nav class="absolute bottom-0 left-0 right-0 z-30 h-14 bg-black border-t border-zinc-900 flex justify-around items-center text-xs">
      <button class="flex flex-col items-center gap-1 font-bold text-white">
        <span>🏠</span>
        <span>Beranda</span>
      </button>
      <button id="btnUpload" class="flex items-center justify-center w-10 h-7 rounded-lg bg-white text-black font-bold text-lg active:scale-95 transition">
        +
      </button>
      <button class="flex flex-col items-center gap-1 text-zinc-400">
        <span>👤</span>
        <span>Profil</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
