<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tikfeed Lite</title>
  <!-- Tailwind CSS & Swiper CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
    .swiper { width: 100%; height: 100vh; }
    .swiper-slide { position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="text-white">

  <!-- Swiper Container -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="video-wrapper">
      
      <!-- Video Item 1 (Contoh Mock Data) -->
      <div class="swiper-slide">
        <video loop playsinline preload="metadata" class="feed-video" src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lighting-1230-large.mp4"></video>
        <!-- Overlay UI -->
        <div class="absolute bottom-6 left-4 z-10 max-w-[70%]">
          <h3 class="font-bold text-lg">@user_kreatif</h3>
          <p class="text-sm text-gray-200 mt-1">Ujicoba Tikfeed Lite versi gratisan! 🔥 #tikfeed #fyp</p>
        </div>
        <!-- Right Action Bar -->
        <div class="absolute right-4 bottom-12 z-10 flex flex-col items-center gap-6">
          <button class="flex flex-col items-center text-xs">
            <span class="text-2xl">❤️</span>
            <span>1.2k</span>
          </button>
          <button class="flex flex-col items-center text-xs">
            <span class="text-2xl">💬</span>
            <span>45</span>
          </button>
          <button class="flex flex-col items-center text-xs">
            <span class="text-2xl">🔗</span>
            <span>Share</span>
          </button>
        </div>
      </div>

      <!-- Video Item 2 -->
      <div class="swiper-slide">
        <video loop playsinline preload="metadata" class="feed-video" src="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-lit-city-street-41563-large.mp4"></video>
        <div class="absolute bottom-6 left-4 z-10 max-w-[70%]">
          <h3 class="font-bold text-lg">@cinematic_vibes</h3>
          <p class="text-sm text-gray-200 mt-1">Visual malam hari di kota. Suka ga?</p>
        </div>
        <div class="absolute right-4 bottom-12 z-10 flex flex-col items-center gap-6">
          <button class="flex flex-col items-center text-xs"><span class="text-2xl">❤️</span><span>890</span></button>
          <button class="flex flex-col items-center text-xs"><span class="text-2xl">💬</span><span>12</span></button>
          <button class="flex flex-col items-center text-xs"><span class="text-2xl">🔗</span><span>Share</span></button>
        </div>
      </div>

    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Inisialisasi Swiper Vertical
    const swiper = new Swiper('.mySwiper', {
      direction: 'vertical',
      mousewheel: true,
      on: {
        init: function () {
          playCurrentVideo(this);
        },
        slideChange: function () {
          playCurrentVideo(this);
        }
      }
    });

    // Fungsi Otomatis Play Video Aktif & Pause Video Lain
    function playCurrentVideo(swiperInstance) {
      const allVideos = document.querySelectorAll('.feed-video');
      allVideos.forEach(v => v.pause());

      const currentSlide = swiperInstance.slides[swiperInstance.activeIndex];
      const activeVideo = currentSlide.querySelector('.feed-video');
      
      if (activeVideo) {
        activeVideo.play().catch(err => {
          console.log("Autoplay terhalang kebijakan browser, klik untuk play:", err);
        });
      }
    }

    // Unmute / Toggle Play dengan Tap Layar
    document.addEventListener('click', (e) => {
      if(e.target.tagName === 'VIDEO') {
        if(e.target.paused) {
          e.target.play();
        } else {
          e.target.pause();
        }
      }
    });
  </script>
</body>
</html>
